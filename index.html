<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="apple-touch-icon" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>一日三餐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #EFF6E9;
    color: #233420;
    min-height: 100vh;
  }
  button, input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #C7D9B8; border-radius: 4px; }

  .app-page { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .seal-icon { width: 42px; height: 42px; border-radius: 10px; background: #B23A2E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .title { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 1px; }
  .subtitle { font-size: 12.5px; color: #5D7A4C; margin: 2px 0 0; }
  .header-actions { display: flex; gap: 8px; }
  .btn-dark { display: flex; align-items: center; gap: 6px; background: #233420; color: #EFF6E9; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .btn-ghost { display: flex; align-items: center; gap: 6px; background: #E6F0DE; color: #3E5233; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }

  .day-tab-bar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 4px; }
  .week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .week-nav-btn { background: #E6F0DE; border: none; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; color: #3E5233; cursor: pointer; white-space: nowrap; }
  .week-nav-btn:hover { background: #D8E6CE; }
  .week-nav-today { background: #233420; color: #EFF6E9; }
  .week-nav-label { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
  .week-nav-tag { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 14.5px; color: #233420; white-space: nowrap; }
  .week-nav-range { font-size: 12px; color: #8CA477; white-space: nowrap; }
  .day-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; padding: 8px 4px; border-radius: 10px; border: 1px solid #D8E6CE; background: #fff; cursor: pointer; position: relative; color: #3E5233; }
  .day-tab:hover { background: #E6F0DE; }
  .day-tab.active { background: #233420; color: #EFF6E9; border-color: #233420; }
  .day-tab.weekend { border-color: #D9A67E; }
  .day-tab .wk { font-size: 11px; opacity: .75; }
  .day-tab .dnum { font-size: 14px; font-weight: 700; }
  .today-dot { position: absolute; top: 4px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: #B23A2E; }

  .section { margin-bottom: 30px; }
  .section-title { font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 700; margin-bottom: 12px; border-left: 4px solid #B23A2E; padding-left: 10px; }
  .hint { font-family: 'Noto Sans SC', sans-serif; font-weight: 400; font-size: 11.5px; color: #8CA477; }

  .layout { display: flex; gap: 20px; align-items: flex-start; }
  .sidebar { display: flex; flex-direction: column; gap: 6px; min-width: 160px; flex-shrink: 0; position: sticky; top: 20px; }
  .sidebar-btn { display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid #D8E6CE; border-radius: 10px; padding: 11px 14px; font-size: 13.5px; color: #3E5233; cursor: pointer; text-align: left; font-weight: 500; }
  .sidebar-btn:hover { background: #E6F0DE; }
  .sidebar-btn.active { background: #233420; color: #EFF6E9; border-color: #233420; }
  .content-area { flex: 1; min-width: 0; }
  .inv-card-wide { max-width: 480px; }

  @media (max-width: 700px) {
    .layout { gap: 10px; }
    .sidebar {
      min-width: 84px; width: 84px; gap: 8px; position: sticky; top: 14px;
    }
    .sidebar-btn { flex-direction: column; padding: 10px 4px; font-size: 10.5px; gap: 4px; text-align: center; }
    .inv-card-wide { max-width: none; }
    .meal-grid { grid-template-columns: 1fr; }
  }

  .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .meal-card { background: #fff; border: 1px solid #D8E6CE; border-radius: 14px; padding: 16px; box-shadow: 0 2px 6px rgba(30,45,26,0.04); }
  .meal-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .meal-label { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 14px; color: #5D7A4C; letter-spacing: 1px; }

  .status-row { display: flex; gap: 5px; margin-bottom: 10px; }
  .status-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; background: #E6F0DE; border: none; border-radius: 7px; padding: 6px 4px; font-size: 11px; cursor: pointer; color: #3E5233; }
  .status-btn.active { background: #233420; color: #EFF6E9; }
  .staple-hint { font-size: 11.5px; color: #8CA477; margin: 0 0 8px; }

  .dish-stack { display: flex; flex-direction: column; gap: 10px; }
  .dish-block { background: #F5FAF0; border: 1px solid #E6F0DE; border-radius: 10px; padding: 10px; }
  .dish-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 6px; }
  .role-tag { font-size: 10px; color: #5D7A4C; background: #E6F0DE; padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
  .recipe-name { font-size: 15px; font-weight: 700; margin: 0; }
  .clickable-name { cursor: pointer; }
  .clickable-name:hover { text-decoration: underline; }
  .detail-hint { font-size: 11px; opacity: .6; }
  .steps-list { margin: 0 0 6px; padding-left: 20px; }
  .steps-list li { font-size: 13px; color: #3E5233; padding: 3px 0; line-height: 1.5; }
  .ing-list { margin: 0 0 6px; padding: 0; list-style: none; }
  .ing-item { font-size: 12px; color: #3E5233; padding: 1px 0; }
  .recipe-note { font-size: 11.5px; color: #8CA477; font-style: italic; margin: 0 0 6px; }
  .time-tag { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #B23A2E; margin: 0 0 8px; }
  .card-actions { display: flex; gap: 8px; }
  .btn-soft { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: #E6F0DE; border: none; border-radius: 8px; padding: 7px 8px; font-size: 12px; cursor: pointer; color: #3E5233; }
  .btn-cook { flex: 1.3; display: flex; align-items: center; justify-content: center; gap: 5px; background: #4F7358; color: #fff; border: none; border-radius: 8px; padding: 7px 8px; font-size: 12px; cursor: pointer; font-weight: 500; }
  .btn-cook:active, .btn-dark:active { transform: scale(0.97); }
  .regen-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-regen { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: none; border: 1px dashed #C7D9B8; border-radius: 8px; padding: 6px; font-size: 11.5px; cursor: pointer; color: #5D7A4C; }

  .cafeteria-box { text-align: center; padding: 16px 0 6px; }
  .cafeteria-text { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .cafeteria-sub { font-size: 11.5px; color: #8CA477; margin: 0; }
  .empty-text { font-size: 12.5px; color: #8CA477; padding: 16px 0; text-align: center; }

  .inv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .inv-card { background: #fff; border: 1px solid #D8E6CE; border-radius: 14px; padding: 12px 14px; }
  .inv-card-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 14px; color: #233420; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #E6F0DE; }
  .add-btn { background: #E6F0DE; border: none; border-radius: 6px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #5D7A4C; font-size: 14px; line-height: 1; }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 13px; gap: 8px; }
  .item-row:hover { background: #E6F0DE; }
  .item-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item-avatar { width: 28px; height: 28px; border-radius: 8px; background: #E6F0DE; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .item-name { color: #2E3D26; cursor: pointer; border-bottom: 1px dashed #C7D9B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rename-input { border: 1px solid #4F7358; border-radius: 6px; padding: 3px 6px; font-size: 13px; width: 110px; outline: none; }
  .qty-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .qty-btn { background: #E6F0DE; border: none; border-radius: 5px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #3E5233; font-size: 13px; line-height: 1; }
  .qty-btn.del-btn { font-size: 10px; opacity: .55; }
  .qty-btn.del-btn:hover { opacity: 1; background: #F3DCD8; }
  .qty-text { font-size: 12px; min-width: 52px; text-align: center; color: #3E5233; cursor: pointer; border-bottom: 1px dashed #C7D9B8; }
  .qty-edit-input { border: 1px solid #4F7358; border-radius: 6px; padding: 2px 4px; font-size: 12px; width: 56px; outline: none; text-align: center; }
  .add-form { display: flex; gap: 5px; margin-top: 8px; align-items: center; }
  .add-input { border: 1px solid #D8E6CE; border-radius: 6px; padding: 5px 7px; font-size: 12px; flex: 1; min-width: 0; }
  .confirm-add-btn { background: #4F7358; border: none; border-radius: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; flex-shrink: 0; }

  .condiment-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .condiment-tag { background: #E6F0DE; color: #3E5233; font-size: 12px; padding: 5px 10px; border-radius: 20px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(30,45,26,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: #EFF6E9; border-radius: 16px; width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
  .modal-title { font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 700; margin: 0; }
  .icon-btn { background: none; border: none; cursor: pointer; color: #3E5233; font-size: 18px; line-height: 1; padding: 2px; }
  .search-input { border: 1px solid #D8E6CE; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; outline: none; width: 100%; flex-shrink: 0; }
  .recipe-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .recipe-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #D8E6CE; border-radius: 10px; padding: 10px 12px; }
  .recipe-row.selected { border-color: #4F7358; background: #F2F7F2; }
  .recipe-row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .recipe-row-name { font-size: 13.5px; font-weight: 700; }
  .avail-badge { font-size: 10px; color: #fff; padding: 2px 7px; border-radius: 10px; }
  .recipe-row-ing { font-size: 11.5px; color: #5D7A4C; margin: 3px 0 0; }
  .btn-cook-small { background: #233420; color: #fff; border: none; border-radius: 7px; padding: 6px 12px; font-size: 12px; flex-shrink: 0; cursor: pointer; }

  .import-hint { font-size: 12.5px; color: #5D7A4C; margin: 0 0 10px; }
  .textarea { width: 100%; border: 1px solid #D8E6CE; border-radius: 8px; padding: 10px; font-size: 13px; font-family: inherit; resize: vertical; margin-bottom: 10px; outline: none; }
  .upload-box { display: flex; align-items: center; gap: 8px; border: 1px dashed #C7D9B8; border-radius: 8px; padding: 10px 12px; cursor: pointer; margin-bottom: 10px; }
  .error-text { font-size: 12px; color: #B23A2E; margin: 0 0 10px; }
  .btn-parse { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: #B23A2E; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
  .btn-parse:disabled { opacity: .6; cursor: not-allowed; }
  .form-label { font-size: 12px; color: #5D7A4C; font-weight: 700; display: block; margin: 10px 0 5px; }
  .form-input { width: 100%; border: 1px solid #D8E6CE; border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; }
  .meal-toggle { background: #E6F0DE; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; color: #3E5233; }
  .meal-toggle.active { background: #233420; color: #EFF6E9; }
  .draft-ing-row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
  .matched-tag { font-size: 10.5px; color: #4F7358; background: #E4EEE4; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .category-select { border: 1px solid #D8E6CE; border-radius: 6px; font-size: 11.5px; padding: 4px 2px; }
  .add-ing-btn { display: flex; align-items: center; gap: 4px; background: none; border: 1px dashed #C7D9B8; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #5D7A4C; cursor: pointer; margin-bottom: 10px; }
  .ing-picker-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; max-height: 140px; overflow-y: auto; }
  .ing-chip { background: #E6F0DE; border: 1px solid transparent; border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #3E5233; cursor: pointer; }
  .ing-chip.active { background: #4F7358; color: #fff; }
  .api-key-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; background: #E6F0DE; border-radius: 8px; padding: 8px 10px; }
  .api-key-row input { border: 1px solid #D8E6CE; border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none; }
  .api-key-note { font-size: 10.5px; color: #5D7A4C; margin: 0; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #233420; color: #EFF6E9; padding: 10px 18px; border-radius: 24px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 100; }

  .scroll-body { overflow-y: auto; }

  @media (max-width: 480px) {
    .app-page { padding: 14px 10px 48px; }
    .title { font-size: 18px; }
    .header { gap: 10px; }
    .modal { padding: 14px; max-height: 90vh; }
    .meal-card { padding: 12px; }
    .day-tab { min-width: 42px; padding: 6px 2px; }
    .inv-card { padding: 10px; }
    .sidebar { min-width: 68px; width: 68px; }
    .sidebar-btn { padding: 8px 2px; font-size: 9.5px; }
  }
</style>
</head>

/* ============================== 工具函数 ============================== */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtQty(q) {
  return Number.isInteger(q) ? q : Math.round(q * 10) / 10;
}
function findItem(id) {
  for (const cat in state.inventory) {
    const it = state.inventory[cat].find((i) => i.id === id);
    if (it) return { ...it, cat };
  }
  return null;
}
function allRecipes() {
  return RECIPES.concat(state.customRecipes);
}
function findRecipe(id) {
  return allRecipes().find((r) => r.id === id);
}
function canMake(recipe) {
  return recipe.ingredients.every((ing) => {
    const stock = findItem(ing.id);
    return stock && stock.qty >= ing.qty;
  });
}
function pickDistinct(pool, n) {
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n).map((r) => r.id);
}
function getWeekDates(offset) {
  offset = offset || 0;
  const now = new Date();
  const dow = now.getDay();
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday + offset * 7);
  monday.setHours(0, 0, 0, 0);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}
function dateKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function generateDishes(meal, excludeIds) {
  excludeIds = excludeIds || [];
  const recipes = allRecipes();
  const eligible = (role) => recipes.filter((r) => r.meals.includes(meal) && canMake(r) && !excludeIds.includes(r.id) && (!role || r.role === role));
  if (meal === "breakfast") {
    const staplePool = eligible("staple");
    const fullPool = eligible();
    const pool = staplePool.length && Math.random() < 0.75 ? staplePool : fullPool;
    return pool.length ? [pickDistinct(pool, 1)[0]] : [];
  }
  const proteinPool = eligible("protein").concat(eligible("multi"));
  const vegPool = eligible("veg");
  if (proteinPool.length && vegPool.length) {
    return [pickDistinct(proteinPool, 1)[0], pickDistinct(vegPool, 1)[0]];
  }
  if (proteinPool.length) return pickDistinct(proteinPool, Math.min(2, proteinPool.length));
  if (vegPool.length) return pickDistinct(vegPool, Math.min(2, vegPool.length));
  return [];
}
function replacementFor(meal, currentId, comboIds) {
  const recipes = allRecipes();
  const cur = findRecipe(currentId);
  const sameRoleSet = !cur ? ["protein", "multi"] : cur.role === "veg" ? ["veg"] : cur.role === "staple" ? ["staple"] : ["protein", "multi"];
  let pool = recipes.filter((r) => r.meals.includes(meal) && canMake(r) && !comboIds.includes(r.id) && sameRoleSet.includes(r.role));
  if (!pool.length) pool = recipes.filter((r) => r.meals.includes(meal) && canMake(r) && !comboIds.includes(r.id));
  if (!pool.length) return null;
  return pickDistinct(pool, 1)[0];
}
function emptyDayPlan(isWeekend) {
  return {
    breakfast: { status: "recommend", dishIds: [] },
    lunch: { status: isWeekend ? "recommend" : "eatout", dishIds: [] },
    dinner: { status: "recommend", dishIds: [] }
  };
}

/* ============================== 持久化 (localStorage) ============================== */

function persistInventory() {
  try { localStorage.setItem("kitchen-inventory", JSON.stringify(state.inventory)); } catch (e) {}
}
function persistCustomRecipes() {
  try { localStorage.setItem("custom-recipes", JSON.stringify(state.customRecipes)); } catch (e) {}
}
function loadAllWeekPlans() {
  try {
    const raw = localStorage.getItem("week-plans");
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function persistWeekPlan() {
  try {
    const all = loadAllWeekPlans();
    all[state.weekKey] = state.weekPlan;
    localStorage.setItem("week-plans", JSON.stringify(all));
  } catch (e) {}
}
function persistApiKey() {
  try { localStorage.setItem("anthropic-api-key", state.apiKey || ""); } catch (e) {}
}
function persistGeneratedSteps() {
  try { localStorage.setItem("generated-steps", JSON.stringify(state.generatedSteps)); } catch (e) {}
}

function generateWeekPlan(weekKey, weekDates) {
  const all = loadAllWeekPlans();
  let plan = all[weekKey];
  if (!plan) {
    plan = weekDates.map((d) => emptyDayPlan([0, 6].includes(d.getDay())));
  }
  plan = plan.map((day) => {
    const next = Object.assign({}, day);
    MEAL_ORDER.forEach((meal) => {
      const slot = next[meal];
      if (slot.status === "recommend" && slot.dishIds.length === 0) {
        next[meal] = { status: "recommend", dishIds: generateDishes(meal) };
      }
    });
    return next;
  });
  return plan;
}

function loadAll() {
  try {
    const inv = localStorage.getItem("kitchen-inventory");
    state.inventory = inv ? JSON.parse(inv) : JSON.parse(JSON.stringify(INITIAL_INVENTORY));
  } catch (e) { state.inventory = JSON.parse(JSON.stringify(INITIAL_INVENTORY)); }

  try {
    const cr = localStorage.getItem("custom-recipes");
    state.customRecipes = cr ? JSON.parse(cr) : [];
  } catch (e) { state.customRecipes = []; }

  try {
    state.apiKey = localStorage.getItem("anthropic-api-key") || "";
  } catch (e) { state.apiKey = ""; }

  try {
    const gs = localStorage.getItem("generated-steps");
    state.generatedSteps = gs ? JSON.parse(gs) : {};
  } catch (e) { state.generatedSteps = {}; }

  // 从旧版单周存储迁移到多周存储（如果存在旧数据且新存储里还没有对应的周）
  try {
    const oldWp = localStorage.getItem("week-plan");
    if (oldWp) {
      const parsedOld = JSON.parse(oldWp);
      if (parsedOld && parsedOld.key && parsedOld.plan) {
        const all = loadAllWeekPlans();
        if (!all[parsedOld.key]) {
          all[parsedOld.key] = parsedOld.plan;
          localStorage.setItem("week-plans", JSON.stringify(all));
        }
      }
      localStorage.removeItem("week-plan");
    }
  } catch (e) {}

  state.weekOffset = 0;
  state.weekDates = getWeekDates(0);
  state.weekKey = dateKey(state.weekDates[0]);
  const todayStr = dateKey(new Date());
  let idx = state.weekDates.findIndex((d) => dateKey(d) === todayStr);
  state.todayIdx = idx >= 0 ? idx : 0;
  state.selectedDay = state.todayIdx;

  state.weekPlan = generateWeekPlan(state.weekKey, state.weekDates);
  persistWeekPlan();
}

function goToWeek(offset) {
  state.weekOffset = offset;
  state.weekDates = getWeekDates(offset);
  state.weekKey = dateKey(state.weekDates[0]);
  state.weekPlan = generateWeekPlan(state.weekKey, state.weekDates);
  persistWeekPlan();
  const todayStr = dateKey(new Date());
  const idx = state.weekDates.findIndex((d) => dateKey(d) === todayStr);
  state.todayIdx = idx; // -1 when viewing a week that isn't the current one
  state.selectedDay = idx >= 0 ? idx : 0;
  render();
}
function prevWeek() { goToWeek(state.weekOffset - 1); }
function nextWeek() { goToWeek(state.weekOffset + 1); }
function goToCurrentWeek() { goToWeek(0); }

/* ============================== 业务逻辑 ============================== */

function showToast(msg) {
  state.toastMsg = msg;
  render();
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => { state.toastMsg = null; render(); }, 2200);
}

function setMealStatus(dayIdx, meal, status) {
  const day = state.weekPlan[dayIdx];
  const slot = day[meal];
  const dishIds = status === "recommend" && slot.dishIds.length === 0 ? generateDishes(meal) : slot.dishIds;
  day[meal] = { status: status, dishIds: status === "recommend" ? dishIds : [] };
  persistWeekPlan();
  render();
}
function shuffleWholeMeal(dayIdx, meal) {
  const day = state.weekPlan[dayIdx];
  day[meal] = Object.assign({}, day[meal], { dishIds: generateDishes(meal) });
  persistWeekPlan();
  render();
}
function shuffleDish(dayIdx, meal, dishId) {
  const day = state.weekPlan[dayIdx];
  const combo = day[meal].dishIds;
  const replacement = replacementFor(meal, dishId, combo);
  if (!replacement) { showToast("库存不足，没有可换的菜了"); return; }
  day[meal].dishIds = combo.map((id) => (id === dishId ? replacement : id));
  persistWeekPlan();
  render();
}
function cookRecipe(recipeId) {
  const recipe = findRecipe(recipeId);
  if (!recipe) return;
  if (!canMake(recipe)) { showToast("食材不够啦，先补充库存吧"); return; }
  recipe.ingredients.forEach((ing) => {
    const found = findItem(ing.id);
    if (!found) return;
    const arr = state.inventory[found.cat];
    const item = arr.find((i) => i.id === ing.id);
    item.qty = Math.max(0, Math.round((item.qty - ing.qty) * 100) / 100);
  });
  persistInventory();
  showToast(`已记录：${recipe.name} 🥢`);
  render();
}
function adjustQty(cat, id, delta) {
  const item = state.inventory[cat].find((i) => i.id === id);
  if (item) item.qty = Math.max(0, Math.round((item.qty + delta) * 100) / 100);
  persistInventory();
  render();
}
function deleteInventoryItem(cat, id) {
  const item = state.inventory[cat].find((i) => i.id === id);
  if (!item) return;
  const usedIn = allRecipes().filter((r) => r.ingredients.some((ing) => ing.id === id)).map((r) => r.name);
  const warn = usedIn.length ? `\n\n注意：${usedIn.join("、")} 这几道菜谱里用到了它，删除后这些菜会一直显示缺货。` : "";
  if (!confirm(`确定要删除「${item.name}」吗？${warn}`)) return;
  state.inventory[cat] = state.inventory[cat].filter((i) => i.id !== id);
  persistInventory();
  // 同时清理自定义菜谱里对这个食材的引用，避免残留
  let recipesTouched = false;
  state.customRecipes.forEach((r) => {
    const before = r.ingredients.length;
    r.ingredients = r.ingredients.filter((ing) => ing.id !== id);
    if (r.ingredients.length !== before) recipesTouched = true;
  });
  if (recipesTouched) persistCustomRecipes();
  showToast(`已删除「${item.name}」`);
  render();
}

function toggleExistingInSlot(recipeId) {
  if (!state.mealPicker) return;
  const { day, meal } = state.mealPicker;
  const cap = meal === "breakfast" ? 1 : 2;
  const slot = state.weekPlan[day][meal];
  let nextIds;
  if (slot.dishIds.includes(recipeId)) nextIds = slot.dishIds.filter((id) => id !== recipeId);
  else if (slot.dishIds.length < cap) nextIds = slot.dishIds.concat([recipeId]);
  else nextIds = slot.dishIds.slice(1).concat([recipeId]);
  state.weekPlan[day][meal] = { status: "recommend", dishIds: nextIds };
  persistWeekPlan();
  render();

function toggleManualIngredient(itemId) {

async function parseImport() {
  if (!state.importText.trim() && !state.importImage) {

这是我家里已有的食材库存清单（格式为 id: 名称（分类）），如果某个食材本质上就是清单里的某一项，哪怕说法不完全一样（比如"牛肉"实际上就是"肥牛片"、"葱花"就是"葱"、"土豆"就是"马铃薯"），请把对应的 id 填进 matched_id 字段；如果清单里没有对应的东西，matched_id 填 null：

要求：
- meals 从 breakfast/lunch/dinner 中选，按这道菜适合的场景选1-3个
- role: 素菜选 veg；以肉/蛋白质为主选 protein；一道菜里荤素都有选 multi；早餐点心类选 staple

- matched_id 必须是上面清单里真实存在的 id，不确定就填 null，不要编造

    const content = [];

    }
    content.push({ type: "text", text: state.importText.trim() ? `${instruction}\n\n菜谱内容：\n${state.importText.trim()}` : instruction });

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.apiKey.trim(),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 1200,
        messages: [{ role: "user", content: content }]
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || "API 出错");
    const textBlock = (data.content || []).find((b) => b.type === "text");

    const response = await fetch("https://api.anthropic.com/v1/messages", {

            <span class="recipe-name clickable-name" onclick="openRecipeDetail('${recipe.id}')">${esc(recipe.name)} <span class="detail-hint">📖</span></span>
            <span class="role-tag">${ROLE_LABELS[recipe.role] || recipe.role}</span>
          </div>
          <ul class="ing-list">${recipe.ingredients.map((ing) => `<li class="ing-item">${ingredientLine(ing)}</li>`).join("")}</ul>
          ${recipe.note ? `<p class="recipe-note">${esc(recipe.note)}</p>` : ""}
          <p class="time-tag">🔥 约 ${recipe.time} 分钟</p>
          <div class="card-actions">
            <button class="btn-soft" onclick="shuffleDish(${dayIdx}, '${meal}', '${recipe.id}')">🔄 换一个</button>
            <button class="btn-cook" onclick="cookRecipe('${recipe.id}')">✓ 做了</button>
          </div>
        </div>
      `).join("") + `</div>`;
    } else {
      dishesHtml = `<p class="empty-text">库存不足，暂无推荐 — 去补充食材吧</p>`;
    }
    const regenBtn = dishes.length ? `<button class="btn-regen" onclick="shuffleWholeMeal(${dayIdx}, '${meal}')">🔄 整组换一换</button>` : "";
    body = `${staple}${dishesHtml}<div class="regen-row">${regenBtn}<button class="btn-regen" onclick="openMealPicker(${dayIdx}, '${meal}')">➕ 自己选</button></div>`;
  }

  return `<div class="meal-card">
    <div class="meal-card-header"><span>${meta.icon}</span><span class="meal-label">${meta.label}</span></div>
    <div class="status-row">${statusButtons}</div>
    ${body}
  </div>`;
}

function renderInventoryCard(cat) {
  const items = state.inventory[cat];
  const rows = items.map((item) => {
    const isEditing = state.editingItem && state.editingItem.cat === cat && state.editingItem.id === item.id;
    const nameHtml = isEditing
      ? `<input id="rename-input" class="rename-input" value="${esc(state.editingValue)}"
           oninput="state.editingValue=this.value"
           onkeydown="if(event.key==='Enter'){saveRename('${cat}','${item.id}', this.value);} if(event.key==='Escape'){state.editingItem=null; render();}"
           onblur="saveRename('${cat}','${item.id}', this.value)">`
      : `<span class="item-name" onclick="startRename('${cat}','${item.id}')">${esc(item.name)}</span>`;
    const isEditingQty = state.editingQty && state.editingQty.cat === cat && state.editingQty.id === item.id;
    const qtyHtml = isEditingQty
      ? `<input id="qty-edit-input" class="qty-edit-input" type="number" step="any" inputmode="decimal" value="${esc(state.editingQtyValue)}"
           oninput="state.editingQtyValue=this.value"
           onkeydown="if(event.key==='Enter'){saveEditQty('${cat}','${item.id}', this.value);} if(event.key==='Escape'){state.editingQty=null; render();}"
           onblur="saveEditQty('${cat}','${item.id}', this.value)"> ${esc(item.unit)}`
      : `<span class="qty-text" onclick="startEditQty('${cat}','${item.id}')">${fmtQty(item.qty)} ${esc(item.unit)}</span>`;
    return `<div class="item-row" style="opacity:${item.qty <= 0 ? 0.4 : 1}">
      <div class="item-left">
        <span class="item-avatar">${itemEmoji(item.id)}</span>
        ${nameHtml}
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="adjustQty('${cat}','${item.id}',-1)">−</button>
        ${qtyHtml}
        <button class="qty-btn" onclick="adjustQty('${cat}','${item.id}',1)">+</button>
        <button class="qty-btn del-btn" onclick="deleteInventoryItem('${cat}','${item.id}')" title="删除这个食材">🗑️</button>
      </div>
    </div>`;
  }).join("");
  const addForm = state.addingTo === cat ? `
    <div class="add-form">
      <input class="add-input" placeholder="名称" value="${esc(state.newItem.name)}" oninput="state.newItem.name=this.value">
      <input class="add-input" style="width:50px" placeholder="量" value="${esc(state.newItem.qty)}" oninput="state.newItem.qty=this.value">
      <input class="add-input" style="width:50px" placeholder="单位" value="${esc(state.newItem.unit)}" oninput="state.newItem.unit=this.value">
      <button class="confirm-add-btn" onclick="confirmAddItem('${cat}')">✓</button>
    </div>` : "";
  return `<div class="inv-card inv-card-wide">
    <div class="inv-card-header"><span>${esc(cat)}</span><button class="add-btn" onclick="toggleAddForm('${cat}')">+</button></div>
    ${rows}
    ${addForm}
  </div>`;
}

      <textarea class="textarea" rows="5" placeholder="粘贴菜名 / 食材 / 做法文字…" oninput="state.importText=this.value">${esc(state.importText)}</textarea>
      <label class="upload-box">
        <span>🖼️</span>
        <span style="font-size:12.5px;color:#5D7A4C">${state.importImage ? esc(state.importImage.name) : "上传截图（可选）"}</span>
        <input type="file" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
      </label>
      ${state.parseError ? `<p class="error-text">${esc(state.parseError)}</p>` : ""}
      <button class="btn-parse" onclick="parseImport()" ${state.parsing ? "disabled" : ""}>✨ ${state.parsing ? "解析中…" : "AI 解析"}</button>
    `;
    inner = `${apiKeyRow}${modeTabs}${state.importMode === "single" ? singleInner : renderBatchInner()}`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this){closeImport();}">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><h3 class="modal-title">导入菜谱</h3><button class="icon-btn" onclick="closeImport()">✕</button></div>
      ${inner}
    </div>
  </div>`;
}

function render() {
  const day = state.weekPlan[state.selectedDay];
  const dayDate = state.weekDates[state.selectedDay];
  const isWeekendDay = [0, 6].includes(dayDate.getDay());
  const dateLabel = dayDate.toLocaleDateString("zh-CN", { month: "long", day: "numeric" });

  const dayTabs = state.weekDates.map((d, i) => {
    const wk = [0, 6].includes(d.getDay());
    const active = i === state.selectedDay;
    const isToday = i === state.todayIdx;
    return `<button class="day-tab ${active ? 'active' : ''} ${wk ? 'weekend' : ''}" onclick="state.selectedDay=${i}; render();">
      <span class="wk">${WEEKDAY_LABELS[i]}</span><span class="dnum">${d.getDate()}</span>${isToday ? '<span class="today-dot"></span>' : ''}
    </button>`;
  }).join("");

  const mealCards = MEAL_ORDER.map((meal) => renderMealCard(state.selectedDay, meal)).join("");

  const weekRangeLabel = `${state.weekDates[0].getMonth() + 1}月${state.weekDates[0].getDate()}日 - ${state.weekDates[6].getMonth() + 1}月${state.weekDates[6].getDate()}日`;
  const weekOffsetLabel = state.weekOffset === 0 ? "本周" : state.weekOffset === 1 ? "下周" : state.weekOffset === -1 ? "上周" : (state.weekOffset > 0 ? `未来第 ${state.weekOffset} 周` : `之前第 ${-state.weekOffset} 周`);

  const menuTabHtml = `
    <div class="week-nav">
      <button class="week-nav-btn" onclick="prevWeek()">‹ 上一周</button>
      <div class="week-nav-label">
        <span class="week-nav-tag">${weekOffsetLabel}</span>
        <span class="week-nav-range">${weekRangeLabel}</span>
      </div>
      <button class="week-nav-btn" onclick="nextWeek()">下一周 ›</button>
      ${state.weekOffset !== 0 ? `<button class="week-nav-btn week-nav-today" onclick="goToCurrentWeek()">回到本周</button>` : ""}
    </div>
    <div class="day-tab-bar">${dayTabs}</div>
    <div class="meal-grid">${mealCards}</div>
  `;
  const inventoryTabHtml = renderInventoryTab();
  const condimentsTabHtml = `
    <p class="hint" style="display:block;margin-bottom:12px">默认充足，不计数</p>
    <div class="condiment-wrap">${CONDIMENTS.map((c) => `<span class="condiment-tag">${esc(c)}</span>`).join("")}</div>
  `;

  const tabContent = state.activeTab === "menu" ? menuTabHtml : state.activeTab === "inventory" ? inventoryTabHtml : condimentsTabHtml;

  const sidebarBtn = (tab, icon, label) =>
    `<button class="sidebar-btn ${state.activeTab === tab ? 'active' : ''}" onclick="setActiveTab('${tab}')"><span>${icon}</span><span>${label}</span></button>`;

  const html = `
    <header class="header">
      <div class="header-left">
        <div class="seal-icon">🍳</div>
        <div>
          <h1 class="title">一日三餐</h1>
          <p class="subtitle">${dateLabel} · ${WEEKDAY_LABELS[state.selectedDay]}${isWeekendDay ? '（周末）' : ''}</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" onclick="openImport()">⬆️ 导入菜谱</button>
        <button class="btn-dark" onclick="state.browseOpen=true; render();">🔍 全部菜谱</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        ${sidebarBtn("menu", "🍽️", "食谱推荐")}
        ${sidebarBtn("inventory", "🧺", "食材库存")}
        ${sidebarBtn("condiments", "🧂", "常备调料")}
      </nav>
      <div class="content-area">${tabContent}</div>
    </div>

    ${renderBrowseModal()}
    ${renderImportModal()}
    ${renderMealPickerModal()}
    ${renderRecipeEditModal()}
    ${renderRecipeDetailModal()}

    ${state.toastMsg ? `<div class="toast">${esc(state.toastMsg)}</div>` : ""}
  `;

  document.getElementById("app").innerHTML = html;
  attachLiveSearchHandlers();
}

function attachLiveSearchHandlers() {
  const browseInput = document.getElementById("browse-search-input");
  if (browseInput) {
    browseInput.addEventListener("input", (e) => {
      state.browseFilter = e.target.value;
      const list = document.getElementById("browse-list");
      if (list) list.innerHTML = renderBrowseModalInner();
    });
  }
  const pickerInput = document.getElementById("picker-search-input");
  if (pickerInput) {
    pickerInput.addEventListener("input", (e) => {
      state.pickerSearch = e.target.value;
      const list = document.getElementById("picker-list");
      if (list) list.innerHTML = renderPickerExistingInner();
    });
  }
  const ingInput = document.getElementById("manual-ing-search");
  if (ingInput) {
    ingInput.addEventListener("input", (e) => {
      state.manualIngPicker = e.target.value;
      const grid = document.getElementById("manual-ing-grid");
      if (grid) grid.innerHTML = renderIngPickerInner();
    });
  }
  const editIngInput = document.getElementById("edit-ing-search");
  if (editIngInput) {
    editIngInput.addEventListener("input", (e) => {
      state.editRecipeIngPicker = e.target.value;
      const grid = document.getElementById("edit-ing-grid");
      if (grid) grid.innerHTML = renderEditIngPickerInner();
    });
  }
}

/* ============================== 初始化 ============================== */

loadAll();
render();
</script>
</body>
</html>
